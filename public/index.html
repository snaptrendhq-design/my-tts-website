<!DOCTYPE html>
<html>
<head>
<title>SnapTrendHQ AI Voice</title>
</head>
<body>

<h1>Cartesia AI Voice</h1>

<textarea
id="text"
rows="10"
cols="50"
placeholder="Type text here">
</textarea>

<br><br>

<select id="voice">

<option value="a5136bf9-224c-4d76-b823-52bd5efcffcc">
Voice 1
</option>

<option value="4459a9a5-69d6-4680-b970-e13dc51845b6">
Voice 2
</option>

</select>

<br><br>

<button onclick="generateVoice()">
Generate Voice
</button>

<br><br>

<audio id="player" controls></audio>

<script>

async function generateVoice() {

const text =
document.getElementById("text").value;

const voiceId =
document.getElementById("voice").value;

const response =
await fetch("/tts", {
method: "POST",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify({
text,
voiceId
})
});

const blob =
await response.blob();

const url =
URL.createObjectURL(blob);

document.getElementById(
"player"
).src = url;

}

</script>

</body>
</html>
